$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Call to action
status: stable
group: Galvus Design System
description: 'Centred call-to-action band on a dark gradient with heading, text and button. Matches <section class="cta"> in sample-input.html.'
libraryOverrides:
  dependencies:
    - galvus_ds/global
props:
  type: object
  required:
    - heading
    - button_label
    - button_url
  properties:
    heading:
      type: string
      title: Heading (H2)
      maxLength: 120
      examples:
        - Ready to get started?
    text:
      type: string
      title: Text
      pattern: '(.|\r?\n)*'
      examples:
        - Join the patient support programme to receive helpful tips and resources by email.
    button_label:
      type: string
      title: Button label
      maxLength: 40
      examples:
        - Join the programme
    button_url:
      type: string
      format: uri-reference
      title: Button URL
      # Source uses href="#", which Canvas rejects as an example URL.
      examples:
        - /join
    anchor_id:
      type: string
      title: Section anchor ID
      maxLength: 40
      examples:
        - join
